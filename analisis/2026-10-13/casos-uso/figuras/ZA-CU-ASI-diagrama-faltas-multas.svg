<polyline points="220,467 395,467 395,400 850,400 850,290 878,290" fill="none" stroke="#4C5B4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1450,302 1380,302 1380,175 850,175 850,290 832,290" fill="none" stroke="#4C5B4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
