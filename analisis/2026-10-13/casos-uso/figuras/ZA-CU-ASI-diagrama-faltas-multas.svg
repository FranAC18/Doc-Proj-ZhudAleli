<g stroke="#642138" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="185" cy="425" r="17" fill="#FFFFFF"/><path d="M185 442 V501 M153 467 H217 M185 501 L157 541 M185 501 L213 541"/></g><text x="185" y="576" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="22" font-weight="bold" fill="#642138">Tesorera</text>
<g stroke="#642138" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="1450" cy="260" r="17" fill="#FFFFFF"/><path d="M1450 277 V336 M1418 302 H1482 M1450 336 L1422 376 M1450 336 L1478 376"/></g><text x="1450" y="411" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="22" font-weight="bold" fill="#642138">Planificación</text><text x="1450" y="438" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="18" font-weight="normal" fill="#292929">envía el cierre</text>
<ellipse cx="660" cy="290" rx="172" ry="76" fill="#F0EAC8" stroke="#642138" stroke-width="4"/><text x="660" y="275" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="21" font-weight="normal" fill="#292929">Generar falta al cierre</text><text x="660" y="306" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="21" font-weight="normal" fill="#292929">de la actividad</text>
<ellipse cx="1050" cy="505" rx="172" ry="76" fill="#F0EAC8" stroke="#642138" stroke-width="4"/><text x="1050" y="490" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="21" font-weight="normal" fill="#292929">Presentar justificación</text><text x="1050" y="521" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="21" font-weight="normal" fill="#292929">de falta (≤ 3 días hábiles)</text>
<ellipse cx="1050" cy="290" rx="172" ry="76" fill="#F0EAC8" stroke="#642138" stroke-width="4"/><text x="1050" y="275" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="21" font-weight="normal" fill="#292929">Validar procedencia</text><text x="1050" y="306" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="21" font-weight="normal" fill="#292929">de una multa</text>
<text x="850" y="775" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="20" font-weight="bold" fill="#642138">La generación de una falta no aplica automáticamente una multa.</text>
<text x="850" y="804" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4C5B4A">La resolución del justificativo y las reglas monetarias continúan pendientes de definición.</text>
