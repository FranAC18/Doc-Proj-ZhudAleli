<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="820" viewBox="0 0 1700 820">
<rect width="1700" height="820" fill="#FFFFFF"/>
<text x="850" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="bold" fill="#642138">Diagrama de casos de uso · Faltas y multas</text>
<text x="850" y="101" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="19" font-weight="normal" fill="#4C5B4A">La falta se genera al cierre; la justificación y la multa son decisiones separadas</text>
<rect x="400" y="135" width="900" height="615" rx="10" fill="none" stroke="#AC6E40" stroke-width="3"/>
<rect x="700" y="118" width="300" height="36" fill="#FFFFFF"/>
<text x="850" y="144" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="21" font-weight="bold" fill="#642138">Sistema: Asistencia y participación</text>
