# Routing declarativo del arnés universal.
#
# TASK TYPE -> AGENT -> MODEL PROFILE. Los perfiles describen capacidades, no identificadores
# concretos. El proveedor y el modelo real se seleccionan en el host y no se duplican aquí ni
# en los adaptadores de Codex/OpenCode.
# review = "proportional" exige pruebas y revisión del diff por el escritor; una revisión
# independiente se añade según riesgo o antes de una entrega. "required" conserva la
# revisión independiente para decisiones y cambios de riesgo alto.

[meta]
version = 2
source_of_truth = "docs/context/context-index.md"
model_selection = "runtime-selected"
route_command = "/route"

[model_profiles.reasoning_max]
selection = "host-selected"
capabilities = ["reasoning", "long-context", "structured-output"]
fallback = "host-selected"

[model_profiles.coding_efficient]
selection = "host-selected"
capabilities = ["coding", "tool-use", "structured-output"]
fallback = "host-selected"

[model_profiles.frontend_strong]
selection = "host-selected"
capabilities = ["coding", "ui-review", "accessibility"]
fallback = "host-selected"

[model_profiles.research_efficient]
selection = "host-selected"
capabilities = ["research", "long-context", "citations"]
fallback = "host-selected"

[model_profiles.documentation_economy]
selection = "host-selected"
capabilities = ["writing", "structured-output"]
fallback = "host-selected"

[task_types.architecture]
agent = "architect"
risk = "high"
reasoning = "maximum"
model_profile = "reasoning_max"
context = ["constitution", "relevant architecture docs", "relevant ADRs", "active task"]
review = "required"
delegation = "coordinator-only"

[task_types.planning]
agent = "architect"
risk = "high"
reasoning = "high"
model_profile = "reasoning_max"
context = ["validated requirements", "constitution", "architecture", "active feature index"]
review = "required"
delegation = "coordinator-only"

[task_types.implementation]
agent = "implementer"
risk = "medium"
reasoning = "coding"
model_profile = "coding_efficient"
context = ["current requirement and sprint", "tasks and spec when available", "relevant code", "relevant tests"]
review = "proportional"
delegation = "coordinator-only"

[task_types.frontend]
agent = "frontend"
risk = "medium"
reasoning = "coding"
model_profile = "frontend_strong"
context = ["UI rules", "relevant components", "UI specification", "relevant assets"]
review = "proportional"
delegation = "coordinator-only"

[task_types.debugging]
agent = "implementer"
risk = "high"
reasoning = "high"
model_profile = "coding_efficient"
context = ["symptom", "changed files", "relevant tests", "relevant contracts"]
review = "required"
delegation = "coordinator-only"

[task_types.research]
agent = "researcher"
risk = "low"
reasoning = "focused"
model_profile = "research_efficient"
context = ["question", "only required sources"]
review = "optional"
delegation = "none"

[task_types.review]
agent = "reviewer"
risk = "high"
reasoning = "maximum"
model_profile = "reasoning_max"
context = ["diff", "changed files", "contracts", "tests", "relevant rules"]
review = "independent"
delegation = "none"

[task_types.documentation]
agent = "documenter"
risk = "low"
reasoning = "focused"
model_profile = "documentation_economy"
context = ["source document", "template", "operational state"]
review = "proportional"
delegation = "none"

# Compatibilidad con el contrato universal anterior. Los valores de model son perfiles, no
# nombres de proveedores ni IDs de modelos. OpenChamber no aparece como host de configuración.
[routes.coordinator.primary]
host = "codex"
provider = "runtime"
model = "reasoning_max"
[routes.coordinator.fallback]
host = "opencode"
provider = "runtime"
model = "reasoning_max"

