# Rutas económicas y de continuidad del arnés universal.
# Este archivo no contiene credenciales y no inicia hosts automáticamente.
# Si una cuota se agota, se registra un handoff y se usa la ruta fallback.

[meta]
version = 1
continuity = "manual-handoff"
source_of_truth = "docs/architecture/RUTAS-MODELOS-IA.md"

[routes.coordinator.primary]
host = "codex"
provider = "codex-plan"
model = "selected-in-host"

[routes.coordinator.fallback]
host = "antigravity"
provider = "google-ai-pro"
model = "gemini-3.1-pro"

