<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablas — Sistema de diseño Zhud Alelí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="container py-5">
  <div class="mb-4">
    <a href="../index.html" class="btn btn-link px-0">&larr; Volver al índice</a>
  </div>

  <h1 class="mb-5">Tabla responsiva</h1>

  <section class="mb-5">
    <div class="table-wrap">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th scope="col">Lote</th>
            <th scope="col">Especie</th>
            <th scope="col">Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><div class="za-table-item"><span class="za-table-item-thumb" aria-hidden="true">01</span><span>Lote 01</span></div></td>
            <td>Manzanilla</td>
            <td><span class="badge bg-success-soft"><span class="badge-dot" aria-hidden="true"></span> Completado</span></td>
          </tr>
          <tr>
            <td><div class="za-table-item"><span class="za-table-item-thumb" aria-hidden="true">02</span><span>Lote 02</span></div></td>
            <td>Menta</td>
            <td><span class="badge bg-info-soft"><span class="badge-dot" aria-hidden="true"></span> En proceso</span></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="d-flex justify-content-end mt-3">
      <span class="za-pill-counter">2 registros</span>
    </div>
  </section>

</div>
</body>
</html>
