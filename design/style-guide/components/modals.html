<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modales — Sistema de diseño Zhud Alelí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="container py-5">
  <div class="mb-4">
    <a href="../index.html" class="btn btn-link px-0">&larr; Volver al índice</a>
  </div>

  <h1 class="mb-3">Modales</h1>
  <p class="text-secondary mb-5">Estructura visual para confirmaciones y diálogos. La tecnología que abrirá o cerrará el modal se decidirá durante la implementación.</p>

  <section aria-labelledby="modal-confirmation">
    <h2 id="modal-confirmation">Confirmación</h2>
    <div class="modal position-static d-block mt-4" role="dialog" aria-modal="false" aria-labelledby="modal-title">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h3 class="modal-title" id="modal-title">¿Confirmar esta acción?</h3>
            <button type="button" class="btn-close" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <p class="mb-0">El diálogo debe explicar la acción, su consecuencia y ofrecer una salida segura.</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary">Cancelar</button>
            <button type="button" class="btn btn-primary">Confirmar</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
