<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badges — Sistema de diseño Zhud Alelí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="container py-5">
  <div class="mb-4">
    <a href="../index.html" class="btn btn-link px-0">&larr; Volver al índice</a>
  </div>

  <h1 class="mb-3">Badges y estados</h1>
  <p class="text-secondary mb-5">Etiquetas compactas para comunicar un estado con texto, icono/punto y color.</p>

  <section class="mb-5" aria-labelledby="badge-variants">
    <h2 id="badge-variants">Variantes semánticas</h2>
    <div class="d-flex flex-wrap gap-3 mt-4">
      <span class="badge bg-brand-soft"><span class="badge-dot" aria-hidden="true"></span> Marca</span>
      <span class="badge bg-success-soft"><span class="badge-dot" aria-hidden="true"></span> Completado</span>
      <span class="badge bg-info-soft"><span class="badge-dot" aria-hidden="true"></span> En proceso</span>
      <span class="badge bg-warning-soft"><span class="badge-dot" aria-hidden="true"></span> Pendiente</span>
      <span class="badge bg-danger-soft"><span class="badge-dot" aria-hidden="true"></span> Requiere atención</span>
    </div>
  </section>

  <section class="mb-5" aria-labelledby="badge-outline">
    <h2 id="badge-outline">Variante contorno</h2>
    <div class="d-flex flex-wrap gap-3 mt-4">
      <span class="badge badge-outline bg-brand-soft"><span class="badge-dot" aria-hidden="true"></span> Borrador</span>
      <span class="badge badge-outline bg-danger-soft"><span class="badge-dot" aria-hidden="true"></span> Bloqueado</span>
    </div>
  </section>

  <section aria-labelledby="badge-counter">
    <h2 id="badge-counter">Contadores</h2>
    <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
      <span class="za-pill-counter">12 registros</span>
      <span class="za-pill-counter">3 pendientes</span>
    </div>
  </section>
</main>
</body>
</html>
